[package]
name = "png_pong"
version = "0.12.0"
license = "(Apache-2.0 OR BSL-1.0 OR MIT) AND Zlib"
description = "A pure Rust PNG/APNG encoder & decoder"
repository = "https://github.com/AldaronLau/png_pong"
documentation = "https://docs.rs/png_pong"
homepage = "https://github.com/AldaronLau/png_pong/releases"
include = [
  "Cargo.toml",
  "README.md",
  "LICENSE-ZLIB",
  "LICENSE-APACHE",
  "src/*",
  "benches/*",
]
categories = ["multimedia::encoding", "multimedia::images"]
keywords = ["png", "encoder", "decoder", "apng", "image"]
readme = "README.md"
edition = "2024"
rust-version = "1.91"

[dependencies.pix]
version = "1.0.0"

[dependencies.simd-adler32]
version = "0.3.9"

[dependencies.miniz_oxide]
version = "0.9.1"
features = ["simd"]

[dependencies.parsenic]
version = "0.2.1"

[dependencies.traitful]
version = "0.3.0"

# Currently not a dev-dependency since it's required for miri to be optional
#
# dev-dependencies are not allowed to be optional, though ):
[dependencies.criterion]
version = "0.8.2"
optional = true

[package.metadata.docs.rs]
all-features = false
default-target = "x86_64-unknown-linux-gnu"

[[bench]]
name = "encode"
harness = false
required-features = ["criterion"]

[[bench]]
name = "decode"
harness = false
required-features = ["criterion"]

[profile.test]
opt-level = 2

[profile.dev]
opt-level = 2

[features]
default = []
